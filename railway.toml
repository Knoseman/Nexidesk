[build]
builder = "railpack"

[deploy]
preDeployCommand = ["node scripts/migrate.mjs"]
startCommand = "mkdir -p .next/standalone/.next/static && cp -r .next/static/* .next/standalone/.next/static/ 2>/dev/null || true && mkdir -p .next/standalone/public && cp -r public/* .next/standalone/public/ 2>/dev/null || true && node .next/standalone/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environments.production.variables]
PORT = "3000"
HOSTNAME = "0.0.0.0"
NODE_ENV = "production"
